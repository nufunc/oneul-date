<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 앱 토큰(src/style.css :root)을 따른다. 핵심은 가운데 1200x600 안에 둔다(카카오 2:1 크롭). */
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f5f6f8;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
    }

    .title {
      font-size: 170px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #0f172a;
    }

    .sub {
      font-size: 60px;
      font-weight: 700;
      color: #4b5563;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .slots {
      display: flex;
      align-items: center;
      gap: 26px;
      margin-top: 6px;
    }

    .slot {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      padding: 22px 54px;
      border-radius: 28px;
      background: #0f172a;
      color: #ffffff;
    }

    .arrow {
      font-size: 56px;
      font-weight: 700;
      color: #64748b;
      line-height: 1;
    }
  </style>
</head>
<body>
  <h1 class="title">오늘 데이트</h1>
  <p class="sub">조건만 고르면 코스 완성</p>
  <div class="slots">
    <span class="slot">낮</span><span class="arrow">→</span>
    <span class="slot">저녁</span><span class="arrow">→</span>
    <span class="slot">밤</span>
  </div>
</body>
</html>
