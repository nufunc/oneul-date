name: CI

# 배포는 Cloudflare Workers Builds가 main 푸시마다 따로 한다(wrangler.jsonc, P-485).
# 여기서는 같은 커밋을 빌드해 시험하고, Cloudflare 배포가 끝나면 https://oneul.date 에서 @smoke를 본다(P-540)
on:
  push:
    branches: [main]
  # 동기화 워크플로는 기본 GITHUB_TOKEN으로 push해서 위 push 트리거가 발동하지 않는다(GitHub 규칙).
  # 동기화가 성공하면 여기서 그 데이터 커밋을 시험한다
  workflow_run:
    workflows: ["Auto Sync Spots from OCI DB"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

# 성공하지 않은 workflow_run은 job을 건너뛰므로 실행별 그룹에 둬 돌던 시험을 취소하지 않게 한다
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('ci-skip-{0}', github.run_id) || 'ci' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # 전체 이력으로 받는다: build_blog_dates.mjs가 글마다 git 마지막 커밋 날짜를 dateModified와 lastmod로 쓴다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 시험 다수가 dist를 읽으므로 빌드 뒤에 돌린다
      - run: npm test
      # 사용자 흐름 e2e(P-508). 브라우저는 @playwright/test 버전별로 캐시한다
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # 배포된 라이브 주소에서 첫 방문과 공유 흐름(@smoke)만 다시 본다(P-508).
  # Cloudflare 배포는 이 워크플로와 따로 돌므로 같은 커밋의 Workers Builds 검사가 끝나기를 기다린 뒤 본다(P-540)
  smoke-live:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # 검사 이름 대신 Cloudflare 앱(cloudflare-workers-and-pages)으로 찾는다. 20초 간격으로 최대 20분 기다린다
      - name: wait for Cloudflare deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            st=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              -q '([.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")][0] // empty) | "\(.status) \(.conclusion)"')
            echo "try $i: ${st:-none}"
            case "$st" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Cloudflare 배포가 성공하지 않았다: $st"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::20분 안에 $SHA의 Cloudflare 배포가 끝나지 않았다"
          exit 1
      - run: npm run e2e:live -- --grep @smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            playwright-report
            test-results
          retention-days: 7
