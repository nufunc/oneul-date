name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 동기화 워크플로는 기본 GITHUB_TOKEN으로 push해서 위 push 트리거가 발동하지 않는다(GitHub 규칙).
  # 동기화가 성공하면 여기서 배포해 그날 데이터가 라이브에 나가게 한다
  workflow_run:
    workflows: ["Auto Sync Spots from OCI DB"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 성공하지 않은 workflow_run은 job을 건너뛰므로 실행별 그룹에 둬 돌던 배포를 취소하지 않게 한다
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('pages-skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # 전체 이력으로 받는다: build_blog_dates.mjs가 글마다 git 마지막 커밋 날짜를 dateModified와 lastmod로 쓴다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 시험 다수가 dist를 읽으므로 빌드 뒤에 돌린다. 실패하면 업로드와 배포가 멈춘다
      - run: npm test
      # 사용자 흐름 e2e(P-508). 브라우저는 @playwright/test 버전별로 캐시하고, 실패하면 업로드와 배포가 멈춘다
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포된 라이브 주소에서 첫 방문과 공유 흐름(@smoke)만 다시 본다(P-508)
  smoke-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live -- --grep @smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            playwright-report
            test-results
          retention-days: 7
