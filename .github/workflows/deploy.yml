name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 동기화 워크플로는 기본 GITHUB_TOKEN으로 push해서 위 push 트리거가 발동하지 않는다(GitHub 규칙).
  # 동기화가 성공하면 여기서 배포해 그날 데이터가 라이브에 나가게 한다
  workflow_run:
    workflows: ["Auto Sync Spots from OCI DB"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
