name: Deploy to Cloudflare Pages

# 비공개 저장소로 옮긴 뒤의 호스팅 초안이다(P-485). GitHub 무료 요금제는 비공개 저장소에서 Pages를 쓰지 못한다.
# 저장소 비밀값 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID를 넣기 전에는 손으로만 실행하고, 넣은 뒤 push 트리거를 더할지 정한다.
# 저장소 변수(선택): CLOUDFLARE_PROJECT_NAME(기본 oneul-date), SITE_ORIGIN(기본 https://<프로젝트>.pages.dev)
# 근거: developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'oneul-date' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || format('https://{0}.pages.dev', vars.CLOUDFLARE_PROJECT_NAME || 'oneul-date') }}
      BASE_PATH: /
    steps:
      # 비밀값이 없으면 빌드 전에 안내하고 끝낸다
      - name: Check secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::저장소 비밀값 CLOUDFLARE_API_TOKEN과 CLOUDFLARE_ACCOUNT_ID를 먼저 넣는다(Settings > Secrets and variables > Actions)"
            exit 1
          fi
      # 전체 이력으로 받는다: build_blog_dates.mjs가 글마다 git 마지막 커밋 날짜를 dateModified와 lastmod로 쓴다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SITE_ORIGIN·BASE_PATH로 vite base와 dist 안의 사이트 주소를 바꾼다(scripts/rebase_dist.mjs)
      - run: npm run build
      - run: npm test
      # --branch=main이어야 미리보기가 아니라 프로덕션 배포다. 프로젝트는 먼저 만들어 둔다(npx wrangler pages project create)
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
