name: Run Spot Fix

# 승인된 스팟 교정(scripts/merge_verified_spots.py)을 OCI 호스트에서 돌린다.
# 로컬 SSH 키가 호스트에서 거부돼(2026-11-21) 배포와 같은 OCI_SSH_KEY로 붙는다. 수동 실행만 받는다.
on:
  workflow_dispatch:
    inputs:
      proposal:
        description: 교정 제안 번호
        type: choice
        options: [P-552, P-558]
      mode:
        description: dry-run은 계획만 출력, apply는 백업 뒤 DB에 쓴다
        type: choice
        options: [dry-run, apply]
        default: dry-run

concurrency:
  group: spot-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          PROPOSAL: ${{ inputs.proposal }}
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          envs: PROPOSAL,MODE
          script: |
            set -eo pipefail
            REPO=/mnt/data/git/oneul-date
            [ -d "$REPO" ] || REPO="$HOME/oneul-date"
            cd "$REPO"
            # 배포 미러의 다른 파일은 건드리지 않고 교정 스크립트 두 개만 main 판으로 맞춘다
            git fetch -q origin main
            git checkout origin/main -- scripts/merge_verified_spots.py scripts/judge_date_fit.py
            mkdir -p "$HOME/oneul-backups"
            if [ "$MODE" = "apply" ]; then APPLY="--apply"; else APPLY=""; fi
            echo "교정 $PROPOSAL 모드 $MODE, 저장소 $REPO"
            # 호스트 python 3.9는 수집기 모듈 문법을 못 읽어 컨테이너(/app) 안에서 돌린다(impl-446과 같은 방식)
            C=oneul-collector
            T=/tmp/spotfix
            docker exec $C rm -rf $T
            docker exec $C mkdir -p $T/env $T/backups
            # judge_date_fit.py가 옆의 json 목록 파일을 읽으므로 scripts 폴더째 넣는다
            docker cp scripts/. $C:$T/
            # connect()가 host.docker.internal을 127.0.0.1로 바꾸므로 임시 .env에는 그 이름의 IP를 넣는다
            H=$(docker exec $C getent hosts host.docker.internal | awk '{print $1}')
            echo "중계 서버 주소 $H"
            sed "s/host\.docker\.internal/$H/g" collector/.env | docker exec -i $C sh -c "cat > $T/env/.env"
            set +e
            docker exec -w $T -e COLLECTOR_DIR=$T/env -e PYTHONPATH=/app $C python3 merge_verified_spots.py "$PROPOSAL" --backup-dir $T/backups $APPLY
            RC=$?
            set -e
            docker cp $C:$T/backups/. "$HOME/oneul-backups/"
            docker exec $C rm -rf $T
            ls -t "$HOME/oneul-backups" | head -3
            exit $RC
