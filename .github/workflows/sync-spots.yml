name: Auto Sync Spots from OCI DB

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 4시 17분 (UTC 19:17). 정각 예약이 몰려 실행이 2.7~4.6시간 늦어져 분을 비켜 뒀다(2026-09-30)
    - cron: '17 19 * * *'
    # 위 실행이 시작되지 않은 날(2026-09-29·09-30 기준 예약 기록 없음)을 메우는 보조 실행. 변경이 없으면 커밋하지 않으므로 겹쳐도 해가 없다
    - cron: '43 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 겹친 실행이 같은 main을 받아 늦게 푸시한 쪽이 거절되던 것을 막는다. 뒤 실행은 앞 실행이 끝날 때까지 기다린다
concurrency:
  group: sync-spots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sync script
        run: |
          python collector/sync_live_spots.py

      - name: Check for changes and commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          if [ -n "$(git status --porcelain public/data/spots.json public/data/spot_aliases.json src/data/spots.sample.json)" ]; then
            git add public/data/spots.json public/data/spot_aliases.json src/data/spots.sample.json
            git commit -m "chore(data): auto-sync latest spots from OCI PostgreSQL"
            # sync 밖의 푸시와 겹쳐 거절되면 rebase 뒤 다시 푸시한다. 충돌은 동기화 파일을 누가 고쳤다는 뜻이라 바로 실패한다
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              git push origin main && exit 0
              echo "push rejected (try $i), retrying"
              sleep $((i * 5))
            done
            exit 1
          else
            echo "No changes in spots data. Skipping commit."
          fi
