name: Auto Sync Spots from OCI DB

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 4시 17분 (UTC 19:17). 정각 예약이 몰려 실행이 2.7~4.6시간 늦어져 분을 비켜 뒀다(2026-09-30)
    - cron: '17 19 * * *'
    # 위 실행이 시작되지 않은 날(2026-09-29·09-30 기준 예약 기록 없음)을 메우는 보조 실행. 변경이 없으면 커밋하지 않으므로 겹쳐도 해가 없다
    - cron: '43 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sync script
        run: |
          python collector/sync_live_spots.py

      - name: Check for changes and commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          if [ -n "$(git status --porcelain public/data/spots.json public/data/spot_aliases.json)" ]; then
            git add public/data/spots.json public/data/spot_aliases.json
            git commit -m "chore(data): auto-sync latest spots from OCI PostgreSQL"
            git push origin main
          else
            echo "No changes in spots data. Skipping commit."
          fi
