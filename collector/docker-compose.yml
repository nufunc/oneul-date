version: '3.8'

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oneul-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-2}
      - BATCH_LIMIT=${BATCH_LIMIT:-50}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
