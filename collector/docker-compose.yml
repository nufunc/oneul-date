services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: oneul-date/data-collector:latest
    container_name: oneul-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
      - LOG_DIR=/mnt/data/logs
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-60}
      - CHECK_INTERVAL_HOURS=${CHECK_INTERVAL_HOURS:-}
      - DISCOVERY_LIMIT=${DISCOVERY_LIMIT:-150}
      - BATCH_LIMIT=${BATCH_LIMIT:-200}
      # 슬롯 자동교정(Slot Healing) 안전장치
      #   SLOT_HEAL_DRYRUN=1 : 로그만 남기고 slot 을 DB 에 쓰지 않는다
      #   SLOT_HEAL_ALL=1    : day/evening/night 사이 재배치까지 교정 (기본은 stay 축만)
      - SLOT_HEAL_DRYRUN=${SLOT_HEAL_DRYRUN:-}
      - SLOT_HEAL_ALL=${SLOT_HEAL_ALL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DAILY_REPORT_HOUR=${DAILY_REPORT_HOUR:-22}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL:-}
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ${DATA_DIR:-./data}:/mnt/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  # AI 코스 브리핑(supabase/functions/ai-briefing). Supabase 프로젝트가 없어져 OCI에서 같은 Deno 코드를 돌린다
  briefing:
    image: denoland/deno:2.5.6
    container_name: oneul-briefing
    restart: unless-stopped
    command: run --allow-net --allow-env /app/index.ts
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ../supabase/functions/ai-briefing:/app:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  # GitHub Pages(https)에서 부르려면 브리핑도 https여야 한다. sslip.io 주소로 인증서를 자동 발급받는다
  caddy:
    image: caddy:2-alpine
    container_name: oneul-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy:/data
    depends_on:
      - briefing
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
