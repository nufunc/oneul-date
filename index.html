<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>오늘 데이트</title>
    <meta name="description" content="조건만 고르면 완성되는 시간대별 데이트 코스" />
    
    <!-- Theme & Status Bar Styling -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('oneul_theme_mode') || 'light';
          var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.setAttribute('data-theme-resolved', resolved);
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19" />
    <meta name="theme-color" content="#f5f6f8" />

    <!-- Web App Manifest & Mobile PWA Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="오늘 데이트" />
    <meta name="application-name" content="오늘 데이트" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
