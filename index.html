<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>오늘 데이트 | 지역별 데이트·여행 코스 매거진</title>
    <meta name="description" content="지역별 데이트·여행 코스를 정리한 매거진 글을 읽고, 조건을 고르면 시간대별 데이트 코스를 바로 만들 수 있습니다." />
    
    <!-- Theme & Status Bar Styling -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('oneul_theme_mode') || 'light';
          var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.setAttribute('data-theme-resolved', resolved);
          // 받은 코스(#c=) 화면에서는 첫 그리기부터 루트 매거진 블록을 숨긴다. 이후 전환은 src/main.ts가 맡는다
          if (location.hash.indexOf('#c=') === 0) document.documentElement.setAttribute('data-shared-course', '');
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19" />
    <meta name="theme-color" content="#f5f6f8" />

    <!-- Web App Manifest & Mobile PWA Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="오늘 데이트" />
    <meta name="application-name" content="오늘 데이트" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
